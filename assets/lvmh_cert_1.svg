<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="100%" height="100%">
  <!-- Background Cream Texture -->
  <rect width="1400" height="980" fill="#FAF9F6"/>
  
  <!-- Outer Dark Navy Border -->
  <rect width="1400" height="980" fill="none" stroke="#0B1325" stroke-width="28"/>
  <rect x="20" y="20" width="1360" height="940" fill="none" stroke="#E2D9C8" stroke-width="3"/>
  <rect x="30" y="30" width="1340" height="920" fill="none" stroke="#0B1325" stroke-width="1.5"/>

  <!-- Official Top Left Stamp / Badge -->
  <g transform="translate(180, 160) rotate(-10)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#C5B38F" stroke-width="3.5" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#C5B38F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#C5B38F" stroke-width="0.75"/>
    <text x="0" y="-28" font-family="'Times New Roman', Georgia, serif" font-size="13" font-weight="bold" fill="#A8946B" text-anchor="middle" letter-spacing="4">OFFICIAL</text>
    <text x="0" y="-4" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" fill="#A8946B" text-anchor="middle" letter-spacing="4">INSIDE</text>
    <text x="0" y="22" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" fill="#A8946B" text-anchor="middle" letter-spacing="4">LVMH</text>
    <text x="0" y="44" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="bold" fill="#A8946B" text-anchor="middle" letter-spacing="3">CERTIFICATE</text>
  </g>

  <!-- LVMH Monogram Header -->
  <text x="700" y="190" font-family="'Times New Roman', Georgia, serif" font-size="88" font-weight="normal" fill="#111111" text-anchor="middle" letter-spacing="16">LVMH</text>
  
  <text x="700" y="260" font-family="'Times New Roman', Georgia, serif" font-size="26" font-style="italic" fill="#555555" text-anchor="middle">attests that</text>
  
  <!-- Candidate Name -->
  <text x="700" y="360" font-family="'Times New Roman', Georgia, serif" font-size="58" font-weight="normal" fill="#111111" text-anchor="middle" letter-spacing="1">Luka Xiong</text>
  
  <text x="700" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#333333" text-anchor="middle">has successfully completed the</text>
  
  <!-- INSIDE LVMH CERTIFICATE Title -->
  <text x="700" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="4">INSIDE LVMH CERTIFICATE</text>
  
  <!-- Full Description Text -->
  <text x="700" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#444444" text-anchor="middle">and learned about the LVMH ecosystem, the fundamentals of the luxury industry and its key challenges,</text>
  <text x="700" y="618" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#444444" text-anchor="middle">with a specialization in:</text>
  
  <!-- Specialization -->
  <text x="700" y="690" font-family="'Times New Roman', Georgia, serif" font-size="28" font-style="italic" font-weight="bold" fill="#111111" text-anchor="middle">Operations &amp; Supply Chain, Retail &amp; Customer Experience.</text>
  
  <!-- Footer Metadata & Verification Code -->
  <line x1="450" y1="750" x2="950" y2="750" stroke="#CCCCCC" stroke-width="1"/>
  
  <text x="700" y="795" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#555555" text-anchor="middle">Certification date: 05/07/2026</text>
  <text x="700" y="830" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#777777" text-anchor="middle" letter-spacing="1">Document ID: a361674b-f0f9-4cda-a6a6-a976377d6336</text>
  <text x="700" y="855" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#888888" text-anchor="middle" letter-spacing="0.5">Verified online at inside.lvmh.com</text>
